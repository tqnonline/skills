name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node scripts/validate.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/run-tests.mjs

      # Decide the branch of the release ourselves rather than reading it back
      # from the versioning action. When that action fails it may not set its
      # outputs at all, and a tag step conditioned on a missing output silently
      # does nothing — which looks identical to a release that had nothing to do.
      - name: Count pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changeset(s) pending"

      # continue-on-error because this action does its real work — versioning,
      # committing, pushing the branch — before it opens the pull request, and
      # opening that pull request is refused outright where an organization
      # disallows Actions from creating them. A refusal at that last step is not
      # a failed release, and the step below tells the two cases apart rather
      # than letting either pass unnoticed.
      - name: Version packages
        id: changesets
        if: steps.pending.outputs.count != '0'
        continue-on-error: true
        uses: changesets/action@v1
        with:
          version: bash scripts/version-packages.sh
          title: "chore(release): version packages"
          commit: "chore(release): version packages"

      - name: Ensure the version pull request exists
        if: steps.pending.outputs.count != '0' && steps.changesets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: changeset-release/main
        run: |
          # A branch left over from an earlier release would make a genuine
          # versioning failure look like a permission problem, so existence is
          # not enough: the branch has to have been built from this very commit.
          # The action branches from the head it is running on, so its parent is
          # this run's commit when — and only when — it was just pushed.
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Versioning failed before pushing $BRANCH, so this is not a pull-request permission problem. Read the step above."
            exit 1
          fi
          git fetch --quiet origin "$BRANCH"
          parent=$(git rev-parse "origin/$BRANCH^" 2>/dev/null || echo none)
          if [ "$parent" != "$GITHUB_SHA" ]; then
            echo "::error::$BRANCH exists but was built from $parent rather than this commit ($GITHUB_SHA), so it is left over from an earlier release and this failure is not about pull-request permissions. Read the step above."
            exit 1
          fi
          existing=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Version pull request #$existing is already open."
            exit 0
          fi
          echo "::warning::The versioning action pushed $BRANCH but could not open its pull request. Opening it here. If this recurs, allow GitHub Actions to create pull requests in the organization's Actions settings."
          gh pr create --head "$BRANCH" --base main \
            --title "chore(release): version packages" \
            --body "Generated by the release workflow. Merging this publishes the version and tags it."

      - name: Tag and create a GitHub release
        if: steps.pending.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to release."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes
