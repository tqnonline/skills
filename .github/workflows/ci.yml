name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/run-tests.mjs
      - run: node scripts/gen-openai-yaml.mjs
      - run: node scripts/gen-amp-doctrine.mjs --check
      - run: node tools/opencode-workflows/test-runner.mjs
