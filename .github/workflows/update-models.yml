name: Update models
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only (no research run)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  freshness-check:
    if: github.event_name == 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/run-tests.mjs
      - name: Check registry freshness
        id: freshness
        run: |
          node scripts/check-registry-freshness.mjs && echo "overdue=false" >> "$GITHUB_OUTPUT" \
            || { echo "overdue=true" >> "$GITHUB_OUTPUT"; true; }
      - name: File a review-due issue
        if: steps.freshness.outputs.overdue == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Model registry review due ($(date +%Y-%m-%d))" \
            --body "\`skills/developer/model-routing/models.md\` is more than 45 days past its last review. Run the \`update-models\` workflow_dispatch (needs \`ANTHROPIC_API_KEY\`) to research current catalogs and open a PR, or review manually and bump the 'Last reviewed' date." \
            --label "model-registry" || true

  research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.mjs
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: node scripts/run-tests.mjs
      - name: Require API key for a real research run
        if: inputs.dry_run == false
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set. Add it in repo settings, or re-run with dry_run:true to validate only."
            exit 1
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Research provider catalogs and propose registry update
        if: inputs.dry_run == false
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Execute skills/developer/update-models/SKILL.md against the live
            Anthropic, OpenAI, and Google model catalogs only (the allowlist
            in skills/developer/model-routing/models.md). Produce an
            evidence-backed before/after table per RESEARCH.md's format.
            Edit only skills/developer/model-routing/models.md and files
            under adapters/. Do not touch any other file. Update the
            "Last reviewed" date. Open a pull request titled
            "chore(model-routing): monthly model registry review" whose body
            is the before/after table plus rationale and rejected
            candidates. Never merge — this always needs human review.
      - name: No PR without a real research run
        if: inputs.dry_run == true
        run: echo "dry_run=true — validated only, no research run and no PR opened."
